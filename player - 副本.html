<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎵 MusicXML 播放器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            background: #f1f4f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px;
        }
        .music-app {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .control-bar {
            background: #fefefe;
            padding: 16px 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #e5eaef;
        }
        .file-btn {
            background: #1e2a3a;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
        }
        .file-btn:hover { background: #0f1a24; transform: scale(0.96); }
        input[type="file"] { display: none; }
        button {
            background: #f0f2f6;
            border: none;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #1f2a3e;
            font-family: inherit;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #playBtn { background: #2b6e3c; color: white; box-shadow: 0 6px 14px rgba(43,110,60,0.25); }
        #stopBtn { background: #9e3c2a; color: white; }
        .tempo-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #1f2a3e;
            font-weight: 500;
        }
        .tempo-control input[type="range"] { width: 100px; accent-color: #1e2a3a; }
        .status-area {
            margin-left: auto;
            background: #eef2fa;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1f3b62;
        }

        /* ===== 乐谱外层包装：relative 用于绿色竖条定位 ===== */
        #scoreWrapper {
            background: #fffcf4;
            min-height: 580px;
            overflow: auto;
            padding: 28px 20px 35px 20px;
            position: relative;
        }
        #scoreContainer { position: relative; }

        /* ===== 绿色播放竖条 ===== */
        #playCursor {
            position: absolute;
            width: 3px;
            top: 0;
            left: 0;
            background: linear-gradient(180deg,
                rgba(34,197,94,0.0)  0%,
                rgba(34,197,94,0.9)  8%,
                rgba(22,163,74,1.0) 50%,
                rgba(34,197,94,0.9) 92%,
                rgba(34,197,94,0.0) 100%);
            box-shadow: 0 0 8px rgba(34,197,94,0.8), 0 0 18px rgba(34,197,94,0.4);
            border-radius: 2px;
            pointer-events: none;
            z-index: 999;
            display: none;
            transition: left 0.06s linear, top 0.06s linear;
        }

        footer {
            background: #fafcff;
            padding: 12px 28px;
            font-size: 0.7rem;
            text-align: center;
            color: #6c7a91;
            border-top: 1px solid #e9edf2;
        }
        @media (max-width: 650px) {
            .control-bar { flex-direction: column; align-items: stretch; }
            .status-area { margin-left: 0; text-align: center; }
            button, .file-btn { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="music-app">
    <div class="control-bar">
        <label class="file-btn">
            📂 加载 MusicXML 乐谱
            <input type="file" id="musicXmlUpload" accept=".musicxml,.xml,.mxl" />
        </label>
        <button id="playBtn" disabled>▶ 播放</button>
        <button id="stopBtn" disabled>⏹ 停止</button>
        <div class="tempo-control">
            <label>速度: <span id="tempoValue">100</span>%</label>
            <input type="range" id="tempoSlider" min="25" max="200" value="100">
        </div>
        <div class="status-area" id="globalStatus">✨ 等待加载乐谱文件</div>
    </div>

    <div id="scoreWrapper">
        <!-- 绿色播放竖条：始终在 DOM，不会被 initOSMD 清除 -->
        <div id="playCursor"></div>
        <!-- OSMD 渲染目标（只清空这里） -->
        <div id="scoreContainer">
            <div style="text-align:center;padding:80px 20px;color:#aaa;font-size:1.1rem;">
                🎼 请上传 MusicXML 文件以开始<br>
                <small style="color:#ccc;">支持 .musicxml、.xml、.mxl 格式</small>
            </div>
        </div>
    </div>

    <footer>🎹 OSMD 渲染 + Web Audio API 播放 | MusicXML 播放器</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.6/build/opensheetmusicdisplay.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>
(function () {
    'use strict';

    // ── DOM refs ──────────────────────────────────────────
    const fileInput    = document.getElementById('musicXmlUpload');
    const playBtn      = document.getElementById('playBtn');
    const stopBtn      = document.getElementById('stopBtn');
    const statusDiv    = document.getElementById('globalStatus');
    const tempoSlider  = document.getElementById('tempoSlider');
    const tempoValEl   = document.getElementById('tempoValue');
    const scoreWrapper = document.getElementById('scoreWrapper');
    const playCursorEl = document.getElementById('playCursor');  // 永远存在于 DOM

    // ── 状态 ─────────────────────────────────────────────
    let osmd            = null;
    let synth           = null;
    let isPlaying       = false;
    let currentXmlData  = null;
    let currentFileName = '';
    let parsedNotes     = [];
    let tempo           = 120;       // 解析出的基础 BPM（已按 beat-type 换算为 quarter-note BPM）
    let tempoMult       = 1.0;
    let timerIds        = [];        // 所有 setTimeout id
    let measurePosMap   = [];        // measureIndex → {x, y, h}
    let lastShownMeasure = -1;

    // ── 工具 ─────────────────────────────────────────────
    function midi2freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function setStatus(t, err) {
        statusDiv.innerHTML = t;
        statusDiv.style.color = err ? '#c0392b' : '#1f3b62';
    }

    // ── OSMD 初始化（只清 scoreContainer，不动 playCursorEl）──
    function initOSMD() {
        document.getElementById('scoreContainer').innerHTML = '';
        osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('scoreContainer', {
            autoResize: true,
            drawTitle: true,
            drawSubtitle: true,
            drawingParameters: 'compact',
            followCursor: false,
        });
        window._osmd = osmd;
    }

    // ── 渲染乐谱 ─────────────────────────────────────────
    async function renderScore(xmlStr, name) {
        setStatus('📖 正在解析: ' + name + ' ...');
        try {
            await osmd.load(xmlStr);
            await osmd.render();
            setStatus('✅ 加载完成 — ' + name);
            return true;
        } catch(e) {
            console.error('[OSMD]', e);
            setStatus('❌ 渲染失败: ' + e.message, true);
            return false;
        }
    }

    // ── 建立小节坐标映射 ─────────────────────────────────
    //
    // 策略：让 OSMD cursor 在 opacity=0 下步进，
    // 用 cursor 的 DOM 元素（任意能找到的）的 getBoundingClientRect
    // 换算成相对 scoreWrapper 的坐标并缓存。
    //
    function buildMeasurePosMap() {
        measurePosMap = [];
        if (!osmd || !osmd.cursor) { console.warn('no cursor'); return; }

        // 注入临时样式：让 OSMD cursor 图片不可见但占位
        const ts = document.createElement('style');
        ts.id = '__tmp_cursor_style__';
        ts.textContent = `
            [id^="cursorImg-"],
            .osmd-cursor,
            svg image[id^="cursor"] {
                opacity: 0 !important;
                visibility: visible !important;
                display: block !important;
            }`;
        document.head.appendChild(ts);

        try {
            osmd.cursor.reset();
            osmd.cursor.show();

            const wRect = scoreWrapper.getBoundingClientRect();
            let lastM = -1, steps = 0;

            while (!osmd.cursor.iterator.EndReached && steps < 5000) {
                steps++;
                const mIdx = osmd.cursor.iterator.CurrentMeasureIndex;

                if (mIdx !== lastM) {
                    // 获取光标元素：OSMD 1.x 公开 cursorElement
                    let el = osmd.cursor.cursorElement || null;

                    // 备选：按 id 前缀匹配
                    if (!el) el = scoreWrapper.querySelector('[id^="cursorImg-"]');
                    // 备选：class
                    if (!el) el = scoreWrapper.querySelector('.osmd-cursor');
                    // 备选：SVG 内的 image 元素
                    if (!el) {
                        const imgs = scoreWrapper.querySelectorAll('svg image');
                        imgs.forEach(img => { if (!el && img.id && img.id.startsWith('cursor')) el = img; });
                    }

                    if (el) {
                        const r = el.getBoundingClientRect();
                        // SVGImageElement 也有 getBoundingClientRect
                        const h = r.height > 5 ? r.height : 0;
                        if (r.width > 0 || h > 0) {
                            measurePosMap[mIdx] = {
                                x: r.left - wRect.left + scoreWrapper.scrollLeft,
                                y: r.top  - wRect.top  + scoreWrapper.scrollTop,
                                h: h > 5 ? h : 120
                            };
                            lastM = mIdx;
                        }
                    }
                }
                osmd.cursor.next();
            }
            osmd.cursor.hide();
            osmd.cursor.reset();
        } catch(e) {
            console.warn('[buildMeasurePosMap]', e);
            try { osmd.cursor.hide(); osmd.cursor.reset(); } catch(_) {}
        } finally {
            const s = document.getElementById('__tmp_cursor_style__');
            if (s) s.remove();
        }

        const found = measurePosMap.filter(Boolean).length;
        console.log('[measurePosMap] 完成，', found, '个小节');

        // 如果全部失败，fallback：用 SVG 里 measure 的 x 坐标
        if (found === 0) fallbackBuildFromSVG();
    }

    // ── Fallback：直接解析 SVG 获取小节 x 坐标 ─────────
    function fallbackBuildFromSVG() {
        console.log('[fallback] 尝试从 SVG 解析小节位置...');
        try {
            const svgs = scoreWrapper.querySelectorAll('svg');
            if (!svgs.length) return;
            const wRect = scoreWrapper.getBoundingClientRect();

            // OSMD 在 SVG 里会给每个 measure 的第一个 stave 加
            // vf-stave (VexFlow) 或类似的 group。
            // 更通用的方法：读所有 <g> 或 <rect> 的 x 属性
            // 实际上 OSMD 渲染的 measureElements 保存在 osmd.Sheet

            if (!osmd.Sheet) return;
            const parts = osmd.Sheet.Parts;
            if (!parts || !parts.length) return;

            const measures = parts[0].Measures || parts[0].measures || [];

            measures.forEach((m, mIdx) => {
                // 尝试从 GraphicalMeasure 拿 PositionAndShape
                const gm = osmd.GraphicSheet && osmd.GraphicSheet.MeasureList;
                if (gm && gm[mIdx]) {
                    const first = gm[mIdx][0]; // 第一个 stave 的 GraphicalMeasure
                    if (first && first.PositionAndShape) {
                        const ps = first.PositionAndShape;
                        // OSMD 坐标单位是"10 像素 = 1 unit"（取决于 zoom）
                        // 需要找到 SVG 的实际缩放
                        const svg = svgs[0];
                        const svgRect = svg.getBoundingClientRect();
                        const viewBox = svg.viewBox.baseVal;
                        if (!viewBox || viewBox.width === 0) return;

                        const scaleX = svgRect.width  / viewBox.width;
                        const scaleY = svgRect.height / viewBox.height;

                        const x = ps.AbsolutePosition ? ps.AbsolutePosition.x * 10 * scaleX : 0;
                        const y = ps.AbsolutePosition ? ps.AbsolutePosition.y * 10 * scaleY : 0;
                        const h = ps.Size ? ps.Size.height * 10 * scaleY : 120;

                        measurePosMap[mIdx] = {
                            x: svgRect.left - wRect.left + scoreWrapper.scrollLeft + x,
                            y: svgRect.top  - wRect.top  + scoreWrapper.scrollTop  + y,
                            h: h > 10 ? h : 120
                        };
                    }
                }
            });
            console.log('[fallback] 完成，', measurePosMap.filter(Boolean).length, '个小节');
        } catch(e) {
            console.warn('[fallback]', e);
        }
    }

    // ── 移动绿色竖条 ──────────────────────────────────────
    function moveCursor(mIdx) {
        if (mIdx === lastShownMeasure) return;
        lastShownMeasure = mIdx;

        const pos = measurePosMap[mIdx];
        if (!pos) return;

        playCursorEl.style.display = 'block';
        playCursorEl.style.left   = pos.x + 'px';
        playCursorEl.style.top    = pos.y + 'px';
        playCursorEl.style.height = pos.h + 'px';

        // 自动滚动
        const sl = scoreWrapper.scrollLeft;
        const cw = scoreWrapper.clientWidth;
        if (pos.x < sl + 40) {
            scoreWrapper.scrollTo({ left: Math.max(0, pos.x - 80), behavior: 'smooth' });
        } else if (pos.x > sl + cw - 80) {
            scoreWrapper.scrollTo({ left: pos.x - 100, behavior: 'smooth' });
        }
    }

    function hideCursor() {
        playCursorEl.style.display = 'none';
        lastShownMeasure = -1;
    }

    // ── MusicXML 解析 ─────────────────────────────────────
    function parseMusicXML(xmlText) {
        const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        const notes = [];
        let detectedTempo = null;
        let globalBeatType = 4;

        doc.querySelectorAll('part').forEach(partEl => {
            let divisions = 1, beats = 4, beatType = 4;
            let measureStart = 0;  // 单位：quarter notes

            partEl.querySelectorAll('measure').forEach((mEl, mIdx) => {
                const attr = mEl.querySelector('attributes');
                if (attr) {
                    const d  = attr.querySelector('divisions');
                    const b  = attr.querySelector('time > beats');
                    const bt = attr.querySelector('time > beat-type');
                    if (d)  divisions = parseInt(d.textContent)  || 1;
                    if (b)  beats     = parseInt(b.textContent)  || 4;
                    if (bt) { beatType = parseInt(bt.textContent) || 4; globalBeatType = beatType; }
                }

                mEl.querySelectorAll('sound[tempo]').forEach(s => {
                    const t = parseFloat(s.getAttribute('tempo'));
                    if (t > 0 && detectedTempo === null) detectedTempo = t;
                });

                const measureDurQ = beats * (4 / beatType);
                let offset = 0;

                Array.from(mEl.children).forEach(el => {
                    if (el.tagName === 'note') {
                        const isRest  = !!el.querySelector('rest');
                        const isChord = !!el.querySelector('chord');
                        const pitchEl = el.querySelector('pitch');
                        const durEl   = el.querySelector('duration');
                        const dur     = parseInt(durEl?.textContent) || 0;
                        if (!dur) return;

                        const durQ = dur / divisions;
                        let freq = null, name = 'REST';

                        if (pitchEl && !isRest) {
                            const step = pitchEl.querySelector('step')?.textContent   || 'C';
                            const oct  = parseInt(pitchEl.querySelector('octave')?.textContent) || 4;
                            const alt  = parseInt(pitchEl.querySelector('alter')?.textContent)  || 0;
                            const smap = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
                            const midi = (oct + 1) * 12 + (smap[step] ?? 0) + alt;
                            freq = midi2freq(midi);
                            name = step + (alt > 0 ? '#' : alt < 0 ? 'b' : '') + oct;
                        }

                        notes.push({
                            measureIndex: mIdx,
                            startTime: measureStart + offset,  // quarter notes from start
                            duration:  durQ,
                            frequency: freq,
                            isRest,
                            name
                        });

                        if (!isChord) offset += durQ;

                    } else if (el.tagName === 'backup') {
                        const d = parseInt(el.querySelector('duration')?.textContent) || 0;
                        offset = Math.max(0, offset - d / divisions);
                    } else if (el.tagName === 'forward') {
                        const d = parseInt(el.querySelector('duration')?.textContent) || 0;
                        offset += d / divisions;
                    }
                });

                measureStart += measureDurQ;
            });
        });

        return { notes, detectedTempo, globalBeatType };
    }

    // ── 音频引擎 ──────────────────────────────────────────
    async function initAudio() {
        await Tone.start();
        if (!synth) {
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.02, decay: 0.1, sustain: 0.35, release: 0.9 },
                maxPolyphony: 16
            }).toDestination();
            synth.volume.value = -8;
        }
    }

    // ── 播放 ─────────────────────────────────────────────
    //
    // 完全基于 AudioContext.currentTime + setTimeout，
    // 避免 Tone.Transport BPM 与手动秒数换算的双重计算。
    //
    async function startPlayback() {
        if (!currentXmlData) { setStatus('请先加载乐谱', true); return; }
        if (isPlaying) stopPlayback();

        await initAudio();

        isPlaying = true;
        playBtn.disabled = true;
        stopBtn.disabled = false;
        setStatus('🎶 播放中...');
        lastShownMeasure = -1;

        const bpm    = tempo * tempoMult;
        const spq    = 60 / bpm;  // 秒每四分音符

        const sorted = [...parsedNotes].sort((a, b) => a.startTime - b.startTime);

        // AudioContext 基准时间
        const ctx    = Tone.getContext().rawContext;
        const t0     = ctx.currentTime + 0.15;   // 小的 lookahead

        let lastMeasureScheduled = -1;

        sorted.forEach(note => {
            const absT  = t0 + note.startTime * spq;   // 绝对 AudioContext 时间
            const durSec = Math.max(note.duration * spq, 0.04);
            const msFromNow = (absT - ctx.currentTime) * 1000;

            // 精确音频调度
            if (!note.isRest && note.frequency && msFromNow > -200) {
                try { synth.triggerAttackRelease(note.frequency, durSec, absT); } catch(e) {}
            }

            // UI 光标（setTimeout 精度对于视觉足够）
            if (note.measureIndex !== lastMeasureScheduled) {
                lastMeasureScheduled = note.measureIndex;
                const id = setTimeout(() => {
                    if (isPlaying) moveCursor(note.measureIndex);
                }, Math.max(0, msFromNow));
                timerIds.push(id);
            }
        });

        // 精确总时长：最后音符结束时刻
        const lastNote = sorted[sorted.length - 1];
        const totalQ   = lastNote ? lastNote.startTime + lastNote.duration : 0;
        const totalMs  = (t0 - ctx.currentTime + totalQ * spq) * 1000;

        const endId = setTimeout(() => {
            if (isPlaying) {
                stopPlayback();
                setStatus('✅ 播放完毕');
            }
        }, totalMs + 1000);  // +1s 等 release 结束
        timerIds.push(endId);
    }

    // ── 停止 ─────────────────────────────────────────────
    function stopPlayback() {
        isPlaying = false;
        timerIds.forEach(id => clearTimeout(id));
        timerIds = [];
        try { if (synth) synth.releaseAll(); } catch(e) {}
        hideCursor();
        playBtn.disabled = false;
        stopBtn.disabled = true;
    }

    // ── 完整加载流程 ──────────────────────────────────────
    async function loadScore(xmlStr, fileName) {
        if (isPlaying) stopPlayback();
        playBtn.disabled = true;
        stopBtn.disabled = true;
        hideCursor();

        initOSMD();  // 只清 scoreContainer

        const ok = await renderScore(xmlStr, fileName);
        if (!ok) return;

        currentXmlData  = xmlStr;
        currentFileName = fileName;

        const parsed = parseMusicXML(xmlStr);
        parsedNotes = parsed.notes;

        const bt = parsed.globalBeatType || 4;
        tempo = parsed.detectedTempo
            ? Math.round(parsed.detectedTempo * (4 / bt))
            : 120;

        tempoMult = 1.0;
        tempoSlider.value = 100;
        tempoValEl.textContent = '100';

        synth = null;
        playBtn.disabled = false;
        setStatus(`✅ 就绪 — ${fileName}，${parsedNotes.length} 个音符，${tempo} BPM`);

        // 等 DOM 稳定后建立坐标映射
        setTimeout(buildMeasurePosMap, 400);

        Tone.start().then(() => initAudio()).catch(() => {});
    }

    // ── 事件绑定 ──────────────────────────────────────────
    fileInput.addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        if (f.size > 12 * 1024 * 1024) { setStatus('❌ 文件超过 12MB', true); return; }
        setStatus('📀 读取中: ' + f.name + ' ...');
        const reader = new FileReader();
        reader.onload = async ev => await loadScore(ev.target.result, f.name);
        reader.onerror = () => setStatus('文件读取出错', true);
        reader.readAsText(f);
    });

    playBtn.addEventListener('click', startPlayback);
    stopBtn.addEventListener('click', () => { stopPlayback(); setStatus('⏸ 已停止'); });

    tempoSlider.addEventListener('input', () => {
        tempoMult = parseInt(tempoSlider.value) / 100;
        tempoValEl.textContent = tempoSlider.value;
    });

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
            e.preventDefault();
            if (isPlaying) { stopPlayback(); setStatus('⏸ 已停止'); }
            else if (!playBtn.disabled) startPlayback();
        }
    });

    // URL 参数自动加载
    window.addEventListener('DOMContentLoaded', async () => {
        const p = new URLSearchParams(location.search).get('file');
        if (p) {
            try {
                const r = await fetch(p);
                if (r.ok) await loadScore(await r.text(), p);
            } catch(e) { console.warn('[URL load]', e); }
        }
    });

    // 首次初始化
    initOSMD();
    setStatus('🎼 就绪，请上传 MusicXML 文件');

})();
</script>
</body>
</html>
