<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:,">

<title>Musikoo · 功能首页</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(1000px 600px at 12% -10%, #dbe9fb 0%, transparent 60%),
        radial-gradient(900px 600px at 95% 0%, #f6e6d6 0%, transparent 55%),
        #eef3f8;
    font-family:system-ui,-apple-system,sans-serif;
    color:#1c2d40;
}

.page{
    max-width:1160px;
    margin:auto;
    padding:42px 24px 54px;
}

.hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    margin-bottom:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border-radius:18px;
    background:linear-gradient(145deg,#2f5f9e,#4b8bc9);
    color:#fff;
    font-size:1.55rem;
    box-shadow:0 10px 24px rgba(47,95,158,.3);
}

.brand h1{
    margin:0;
    font-size:1.7rem;
    letter-spacing:.04em;
}

.brand p{
    margin:4px 0 0;
    color:#66788d;
    font-size:.85rem;
}

.hero-note{
    padding:10px 16px;
    border:1px solid #d9e4ef;
    border-radius:999px;
    background:rgba(255,255,255,.72);
    color:#5b6d82;
    font-size:.78rem;
    white-space:nowrap;
    backdrop-filter:blur(6px);
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
}

.card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:24px;
    border:1px solid rgba(215,226,238,.95);
    border-radius:22px;
    background:rgba(255,255,255,.9);
    box-shadow:0 12px 28px rgba(36,67,108,.08);
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.card::after{
    content:"";
    position:absolute;
    right:-38px;
    top:-38px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:var(--wash,rgba(47,95,158,.09));
}

.card:hover{
    transform:translateY(-3px);
    border-color:#b9cfe6;
    box-shadow:0 18px 36px rgba(36,67,108,.14);
}

.card-head{
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    z-index:1;
}

.card-icon{
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:var(--accent,#2f5f9e);
    color:#fff;
    font-size:1.18rem;
    box-shadow:0 8px 18px rgba(36,67,108,.14);
}

.card h2{
    margin:0;
    font-size:1.05rem;
}

.card-kicker{
    margin:2px 0 0;
    color:#8493a4;
    font-size:.72rem;
    letter-spacing:.06em;
    text-transform:uppercase;
}

.card p{
    margin:0;
    color:#5d6f84;
    font-size:.82rem;
    line-height:1.7;
    position:relative;
    z-index:1;
}

.card ul{
    margin:0;
    padding:0;
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    position:relative;
    z-index:1;
}

.card li{
    padding:4px 9px;
    border-radius:999px;
    background:#f1f6fb;
    color:#4d6379;
    font-size:.7rem;
}

.card-go{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--accent,#2f5f9e);
    font-size:.8rem;
    font-weight:700;
    position:relative;
    z-index:1;
}

.card-go::after{
    content:"→";
    transition:transform .18s ease;
}

.card:hover .card-go::after{
    transform:translateX(3px);
}

.flow{
    margin-top:24px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    padding:18px 22px;
    border:1px solid #dbe5ef;
    border-radius:18px;
    background:rgba(255,255,255,.66);
    color:#617388;
    font-size:.78rem;
}

.flow strong{
    color:#2f5f9e;
}

.flow span{
    color:#9aa8b7;
}

footer{
    margin-top:26px;
    text-align:center;
    color:#92a0b0;
    font-size:.72rem;
    line-height:1.8;
}

footer a{
    color:#4b6f98;
    text-decoration:none;
}

@media (max-width:820px){

    .page{
        padding:28px 16px 40px;
    }

    .hero{
        align-items:flex-start;
        flex-direction:column;
        gap:14px;
    }

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="page">

    <header class="hero">

        <div class="brand">

            <div class="logo">🎼</div>

            <div>
                <h1>Musikoo</h1>
                <p>MusicXML 播放、全谱编辑、歌眼抽取与从零作曲</p>
            </div>

        </div>

        <div class="hero-note">
            OSMD 谱面 · SpessaSynth 真实音色 · 纯浏览器运行
        </div>

    </header>

    <main class="grid" id="featureGrid"></main>

    <div class="flow">
        <strong>推荐流程</strong>
        <span>→</span>
        在「播放器」载入曲谱
        <span>→</span>
        用「歌眼抽取」自动抓出主旋律
        <span>→</span>
        到「谱面编辑」精修或移调
        <span>→</span>
        也可以在「新建曲谱」从零写一首并导出
    </div>

    <footer>
        所有功能页共用 <code>js/musikoo-core.js</code> 中的 MusicXML 解析、音高换算、时值模型与导航。<br>
        请通过本地 HTTP 服务打开，例如 <code>python3 -m http.server 8000</code>。
    </footer>

</div>

<script type="module">

import { FEATURES } from "./js/musikoo-core.js?v=20261028b";

const DETAILS = {
    "player.html":{
        kicker:"Playback",
        accent:"#2f5f9e",
        wash:"rgba(47,95,158,.10)",
        description:"载入 MusicXML 后即可播放。支持 tempo、音量、乐器覆盖、小节高亮跟随与多声部混音。",
        bullets:["多声部播放","真实音色","小节高亮","速度/音量调整"]
    },
    "edit.html":{
        kicker:"Full-score editor",
        accent:"#c1701f",
        wash:"rgba(193,112,31,.11)",
        description:"对整份曲谱做细粒度修改：选中任意声部与和弦中的单个音，删除、上下移调、增删时值、添加延音线/连音线。",
        bullets:["选择和弦单音","移调试听","时值增减","撤销/还原/导出"]
    },
    "extract.html":{
        kicker:"Melody extraction",
        accent:"#2b7a5b",
        wash:"rgba(43,122,91,.11)",
        description:"把任意声部、谱表、声部线和小节范围抽成独立片段；也可以一键自动分析并抽取最像主旋律的单声部线条。",
        bullets:["自动主旋律","歌眼片段","拖动改时值","单独保存"]
    },
    "new.html":{
        kicker:"Score builder",
        accent:"#8a4fb0",
        wash:"rgba(138,79,176,.11)",
        description:"从空白曲谱开始，设置标题、拍号、调号与速度，逐小节添加音符、休止符与和弦，实时预览并导出 MusicXML。",
        bullets:["从零构建","和弦/休止符","实时预览","导出 MusicXML"]
    }
};

const grid = document.getElementById("featureGrid");

FEATURES
    .filter(feature => feature.href !== "play.html")
    .forEach(feature => {

        const detail = DETAILS[feature.href] || {};

        const card = document.createElement("a");

        card.className = "card";
        card.href = "./" + feature.href;
        card.style.setProperty("--accent", detail.accent || "#2f5f9e");
        card.style.setProperty("--wash", detail.wash || "rgba(47,95,158,.10)");

        const head = document.createElement("div");
        head.className = "card-head";

        const icon = document.createElement("div");
        icon.className = "card-icon";
        icon.textContent = feature.icon;

        const titleBox = document.createElement("div");

        const title = document.createElement("h2");
        title.textContent = feature.label;

        const kicker = document.createElement("p");
        kicker.className = "card-kicker";
        kicker.textContent = detail.kicker || feature.desc;

        titleBox.appendChild(title);
        titleBox.appendChild(kicker);

        head.appendChild(icon);
        head.appendChild(titleBox);

        const description = document.createElement("p");
        description.textContent = detail.description || feature.desc;

        const list = document.createElement("ul");

        (detail.bullets || []).forEach(text => {

            const item = document.createElement("li");
            item.textContent = text;
            list.appendChild(item);
        });

        const go = document.createElement("span");
        go.className = "card-go";
        go.textContent = "打开页面";

        card.appendChild(head);
        card.appendChild(description);
        card.appendChild(list);
        card.appendChild(go);

        grid.appendChild(card);
    });

</script>

</body>
</html>
