<script type="module">

import { WorkletSynthesizer } from "./vendor/spessasynth_lib.js";

/* =========================================================
   DOM
========================================================= */

const fileInput        = document.getElementById("fileInput");
const playBtn          = document.getElementById("playBtn");
const stopBtn          = document.getElementById("stopBtn");
const statusEl         = document.getElementById("status");
const tempoSlider      = document.getElementById("tempoSlider");

const volumeSlider     = document.getElementById("volumeSlider");
const instrumentSelect = document.getElementById("instrumentSelect");
const scoreWrapper     = document.getElementById("scoreWrapper");
const scoreContainer   = document.getElementById("scoreContainer");
const measureHighlight = document.getElementById("measureHighlight");

/* =========================================================
   状态
========================================================= */

const SOUNDFONT_URL = "./soundfonts/MuseScore_General.sf3";
const SOUNDFONT_ID  = "musescore-general";

let osmd = null;

let audioCtx   = null;
let synth      = null;
let masterGain = null;
let loudnessGain = null;
let limiter    = null;

let soundfontPromise = null;
let soundfontReady   = false;

let timeline     = [];
let measureEvents = [];
let scoreParts   = [];
let totalSec     = 0;
let parsedFileName = "";

let playbackId = 0;
let isPlaying  = false;

let timerIds = [];

let schedulerTimer = null;
let panicTimer     = null;

/* 已经排进 worklet 队列的最晚时间，防止停止后立刻重播时旧事件漏出 */
let scheduledUntil = 0;

/* 新一次播放真正开始发声的时间，之前保持静音 */
let audioGateUntil = 0;

let targetVolume = 0.8;

/*
    SpessaSynth 会把带 time 的事件排进 worklet 内部队列，
    stopAll() 不会清空这个队列。所以只提前调度一小段，
    剩余事件由这里的小窗口调度器逐段喂给它。

    主线程偶尔卡顿（GC、排版、切后台）时，150ms 的余量
    很容易被吃光，事件就会挤在同一时刻。这里留 300ms 余量，
    音频线程仍有足够时间按原定时间发声。
*/
const SCHEDULE_LOOKAHEAD = 0.3;

/* MuseScore General 采样余量很大，需要一级固定增益（约 +26dB） */
const LOUDNESS_GAIN = 20;

let tempoMultiplier = 1.0;

/* =========================================================
   工具
========================================================= */

function setStatus(text, isError=false){

    statusEl.innerHTML = text;
    statusEl.style.color =
        isError ? "#c0392b" : "#24436c";
}

function clamp(v, min, max){
    return Math.min(max, Math.max(min, v));
}

function hideHighlight(){

    if(!measureHighlight) return;

    measureHighlight.style.display = "none";
}

/*
    把 SVG 用户坐标换算成 #scoreWrapper 内容区坐标。
    每次高亮时现算，窗口缩放后也不会错位。
*/
function measureScreenBox(pos){

    const svg = scoreContainer.querySelector("svg");

    if(!svg) return null;

    const ctm = svg.getScreenCTM();
    const wr  = scoreWrapper.getBoundingClientRect();

    const scaleX = Math.hypot(ctm.a, ctm.b);
    const scaleY = Math.hypot(ctm.c, ctm.d);

    return {
        left:
            ctm.a * pos.x + ctm.c * pos.y + ctm.e
            - wr.left + scoreWrapper.scrollLeft,

        top:
            ctm.b * pos.x + ctm.d * pos.y + ctm.f
            - wr.top + scoreWrapper.scrollTop,

        width:  pos.w * scaleX,
        height: pos.h * scaleY
    };
}

/*
    高亮当前播放的小节（浅粉色背景）
*/
function highlightMeasure(measureIndex){

    const pos = measurePosMap[measureIndex];

    if(!pos || !measureHighlight) return;

    const box = measureScreenBox(pos);

    if(!box) return;

    lastHighlightedMeasure = measureIndex;

    measureHighlight.style.display = "block";

    measureHighlight.style.left   = (box.left - 3) + "px";
    measureHighlight.style.top    = (box.top - 5) + "px";
    measureHighlight.style.width  = (box.width + 6) + "px";
    measureHighlight.style.height = (box.height + 10) + "px";

    keepMeasureInView();
}

/*
    当前小节超出可视区域时自动滚动：
    竖直方向把当前小节顶到第一行，水平方向做最小移动。
*/
function keepMeasureInView(){

    if(!measureHighlight) return;

    const hr = measureHighlight.getBoundingClientRect();
    const wr = scoreWrapper.getBoundingClientRect();

    const pad = 28;

    const visTop    = wr.top + pad;
    const visBottom = wr.bottom - pad;
    const visLeft   = wr.left + pad;
    const visRight  = wr.right - pad;

    let top  = scoreWrapper.scrollTop;
    let left = scoreWrapper.scrollLeft;

    if(hr.bottom > visBottom || hr.top < visTop){

        top = Math.max(
            0,
            scoreWrapper.scrollTop + (hr.top - visTop)
        );
    }

    if(hr.left < visLeft){

        left = Math.max(
            0,
            scoreWrapper.scrollLeft + (hr.left - visLeft)
        );
    }
    else if(hr.right > visRight){

        left =
            scoreWrapper.scrollLeft
            + (hr.right - visRight);
    }

    if(
        Math.abs(top - scoreWrapper.scrollTop) > 1 ||
        Math.abs(left - scoreWrapper.scrollLeft) > 1
    ){

        scoreWrapper.scrollTo({
            top,
            left,
            behavior:"smooth"
        });
    }
}

/* =========================================================
   音色库 / 合成器
========================================================= */

async function ensureAudio(){

    if(!audioCtx){

        audioCtx = new AudioContext({ latencyHint:"playback" });

        /*
            音量链路：
            synth → 固定增益 → 限幅器 → 用户音量 → 扬声器
        */

        loudnessGain = audioCtx.createGain();
        loudnessGain.gain.value = LOUDNESS_GAIN;

        limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.value = -6;
        limiter.knee.value      = 2;
        limiter.ratio.value     = 12;
        limiter.attack.value    = 0.004;
        limiter.release.value   = 0.25;

        masterGain = audioCtx.createGain();
        targetVolume = volumeSlider.value / 100;
        masterGain.gain.value = targetVolume;

        loudnessGain.connect(limiter);
        limiter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        // 合成器跑在 AudioWorklet 里，processor 必须和页面同源
        await audioCtx.audioWorklet.addModule(
            "./vendor/spessasynth_processor.min.js"
        );

        // 默认 17 个输出（主输出 + 16 通道），只把主输出接到扬声器
        synth = new WorkletSynthesizer(audioCtx);

        synth.connect(loudnessGain);
    }

    if(audioCtx.state !== "running"){
        await audioCtx.resume();
    }

    return audioCtx;
}

async function ensureSoundfont(){

    await ensureAudio();

    if(soundfontReady) return;

    if(!soundfontPromise){

        soundfontPromise = (async () => {

            setStatus("🎹 正在加载音色库（约 40MB，仅第一次）… 0%");

            const res = await fetch(SOUNDFONT_URL);

            if(!res.ok){
                throw new Error(`HTTP ${res.status}`);
            }

            const total =
                Number(res.headers.get("content-length")) || 0;

            const reader = res.body?.getReader?.();

            let buffer;

            if(reader){

                const chunks = [];
                let received = 0;
                let lastPct  = -1;

                while(true){

                    const { done, value } =
                        await reader.read();

                    if(done) break;

                    chunks.push(value);
                    received += value.length;

                    if(total){

                        const pct =
                            Math.min(100, Math.floor(received / total * 100));

                        if(pct !== lastPct){

                            lastPct = pct;

                            setStatus(
                                `🎹 正在加载音色库… ${pct}%`
                            );
                        }
                    }
                }

                buffer = await new Blob(chunks).arrayBuffer();

            }else{

                buffer = await res.arrayBuffer();
            }

            await synth.soundBankManager.addSoundBank(
                buffer,
                SOUNDFONT_ID
            );

            soundfontReady = true;

        })();
    }

    try{

        await soundfontPromise;

    }catch(e){

        soundfontPromise = null;
        throw e;
    }
}

/* =========================================================

========================================================= */

/*

*/

    [/guitar|吉他/i, 25],
    [/bass|贝斯|低音提琴?/i, 32],
    [/violin|小提琴/i, 40],

        if(re.test(name)) return program;

/* =========================================================
   MusicXML 解析
========================================================= */

const STEP_SEMITONE = {
    C:0, D:2, E:4, F:5, G:7, A:9, B:11
};

const DYNAMIC_VELOCITY = {
    pppp:8, ppp:16, pp:24, p:33, mp:49,
    mf:64, f:80, ff:96, fff:112, ffff:126
};

function pitchToMidi(pitchEl){

    const step =
        pitchEl.querySelector("step")?.textContent?.trim() || "C";

    const octave =
        parseInt(pitchEl.querySelector("octave")?.textContent) || 4;

    const alter =
        parseFloat(
            pitchEl.querySelector("alter")?.textContent || "0"
        ) || 0;

    const midi =
        (octave + 1) * 12
        + (STEP_SEMITONE[step] ?? 0)
        + alter;

    return clamp(Math.round(midi), 0, 127);
}

function readMeasureMeta(mEl){

    const meta = {
        repeatStart:false,
        repeatEnd:false,
        ending:null
    };

    mEl.querySelectorAll("barline").forEach(barline => {

        const repeat = barline.querySelector("repeat");

        if(repeat){

            const dir = repeat.getAttribute("direction");

            if(dir === "forward") meta.repeatStart = true;
            if(dir === "backward") meta.repeatEnd = true;
        }

        const ending = barline.querySelector("ending");

        if(ending){

            meta.ending = {
                number: ending.getAttribute("number") || "",
                type: ending.getAttribute("type")
            };
        }
    });

    return meta;
}

function parsePartMeasures(partEl){

    let divisions = 1;
    let beats     = 4;
    let beatType  = 4;

    let velocity = 80;

    const measures = [];
    const openTies = new Map();

    /*
        装饰音不占谱面时间，先按声部挂起，
        等下一个真正发声的音符确定起点后再统一排进去。
    */
    const pendingGraces = new Map();

    /* 当前小节在整首曲子里的四分音符起点，用于跨小节连音线 */
    let measureStartQ = 0;

    Array.from(partEl.children)
        .filter(el => el.tagName === "measure")
        .forEach((mEl, measureIndex) => {

            const notes = [];
            const cc    = [];

            /*
                MusicXML 用 <backup>/<forward> 在文档里移动时间游标，
                不是让每个声部各自从 0 开始。按文档顺序维护游标，
                踏板、力度等 direction 的位置才不会跑到小节末尾。
            */
            let cursorQ   = 0;
            let maxEndQ   = 0;
            let lastNoteQ = 0;

            let measureTempo = null;

            const advance = q => {

                cursorQ = Math.max(0, cursorQ + q);
                maxEndQ = Math.max(maxEndQ, cursorQ);
            };

            Array.from(mEl.children).forEach(el => {

                if(el.tagName === "attributes"){

                    const d  = el.querySelector("divisions");
                    const b  = el.querySelector("time > beats");
                    const bt = el.querySelector("time > beat-type");

                    if(d)  divisions = parseInt(d.textContent) || divisions;
                    if(b)  beats     = parseInt(b.textContent) || beats;
                    if(bt) beatType  = parseInt(bt.textContent) || beatType;

                    return;
                }

                if(el.tagName === "backup"){

                    const d = parseInt(
                        el.querySelector("duration")?.textContent
                    ) || 0;

                    cursorQ = Math.max(0, cursorQ - d / divisions);

                    return;
                }

                if(el.tagName === "forward"){

                    const d = parseInt(
                        el.querySelector("duration")?.textContent
                    ) || 0;

                    advance(d / divisions);

                    return;
                }

                if(el.tagName === "direction" || el.tagName === "sound"){

                    const sound =
                        el.tagName === "sound"
                            ? el
                            : el.querySelector("sound");

                    if(sound?.getAttribute("tempo")){

                        const t = parseFloat(
                            sound.getAttribute("tempo")
                        );

                        if(t > 0) measureTempo = t;
                    }

                    const dyn = sound?.getAttribute("dynamics");

                    if(dyn){

                        velocity = clamp(
                            Math.round(parseFloat(dyn) * 0.9),
                            4, 127
                        );
                    }
                    else{

                        const mark =
                            el.querySelector("dynamics > *");

                        if(mark && DYNAMIC_VELOCITY[mark.tagName]){

                            velocity = DYNAMIC_VELOCITY[mark.tagName];
                        }
                    }

                    const pedal = el.querySelector("pedal");

                    if(pedal){

                        const type = pedal.getAttribute("type");

                        let value = null;

                        if(type === "start" || type === "change"){
                            value = 127;
                        }
                        else if(type === "stop"){
                            value = 0;
                        }

                        if(value !== null){

                            /*
                                <offset> 的单位是 divisions，
                                正负都允许。
                            */
                            const offset =
                                parseFloat(
                                    el.querySelector("offset")?.textContent
                                ) || 0;

                            cc.push({
                                atQ: Math.max(0, cursorQ + offset / divisions),
                                controller: 64,
                                value
                            });
                        }
                    }

                    return;
                }

                if(el.tagName !== "note") return;

                const isChord = !!el.querySelector("chord");
                const isGrace = !!el.querySelector("grace");
                const isRest  = !!el.querySelector("rest");

                const dur =
                    parseInt(
                        el.querySelector("duration")?.textContent
                    ) || 0;

                const durQ = dur / divisions;

                const voice =
                    el.querySelector("voice")?.textContent || "1";

                const staff =
                    el.querySelector("staff")?.textContent || "1";

                const vk = `${staff}_${voice}`;

                const q = isChord ? lastNoteQ : cursorQ;

                /*
                    和弦音与前一音同时开始，不推进游标；
                    装饰音不占时间，也不推进游标。
                */
                if(!isChord && !isGrace){

                    advance(durQ);
                    lastNoteQ = q;
                }

                if(isRest) return;

                const pitch = el.querySelector("pitch");
                if(!pitch) return;

                const midi = pitchToMidi(pitch);

                let noteVelocity = velocity;

                const velEl = el.querySelector("velocity");

                if(velEl){

                    noteVelocity = clamp(
                        Math.round(
                            parseFloat(velEl.textContent) * 1.27
                        ),
                        1, 127
                    );
                }

                /*
                    装饰音没有 duration，也不推进游标，
                    先挂起，等主音符确定起点后再排到它前面。
                */
                if(isGrace){

                    if(!pendingGraces.has(vk)){
                        pendingGraces.set(vk, []);
                    }

                    pendingGraces.get(vk).push({
                        midi,
                        velocity: noteVelocity
                    });

                    return;
                }

                const graces = pendingGraces.get(vk);

                if(graces?.length && durQ > 0){

                    pendingGraces.delete(vk);

                    /*
                        装饰音从主音符的拍点向前挤出时间，
                        主音符本身仍落在原来的拍点上，后续节奏不变。
                        整组最多 0.35 个四分音符，且不超过主音符的 60%，
                        保证每个装饰音都有足够长度、听得出音高。
                    */
                    const totalGraceQ =
                        Math.min(0.35, durQ * 0.6);

                    const stepQ =
                        totalGraceQ / graces.length;

                    graces.forEach((g, gi) => {

                        const gq =
                            q - totalGraceQ + gi * stepQ;

                        notes.push({
                            q: gq,
                            absQ: measureStartQ + gq,
                            durQ: Math.max(0.02, stepQ * 0.9),
                            midi: g.midi,
                            velocity: g.velocity
                        });
                    });
                }

                const ties =
                    Array.from(el.querySelectorAll("tie"))
                        .map(t => t.getAttribute("type"));

                const tieKey = `${vk}_${midi}`;

                /*
                    连音线：后一个音只延长前一个音，不重新触发
                */
                if(ties.includes("stop") && openTies.has(tieKey)){

                    const prev = openTies.get(tieKey);

                    /*
                        用整首曲子的绝对位置计算，不能只用小节内
                        的 q，否则跨小节的连音线会被小节线截断。
                    */
                    prev.durQ = Math.max(
                        prev.durQ,
                        measureStartQ + q + durQ - prev.absQ
                    );

                    if(ties.includes("start")){
                        openTies.set(tieKey, prev);
                    }
                    else{
                        openTies.delete(tieKey);
                    }

                    return;
                }

                const note = {
                    q,
                    absQ: measureStartQ + q,
                    durQ,
                    midi,
                    velocity: noteVelocity
                };

                notes.push(note);

                if(ties.includes("start")){
                    openTies.set(tieKey, note);
                }
            });

            const isImplicit =
                mEl.getAttribute("implicit") === "yes";

            const nominalQ = beats * (4 / beatType);

            /*
                弱起小节（anacrusis）的实际时值比名义时值短。
                MuseScore 导出的弱起小节经常不带 implicit="yes"，
                所以第一小节内容不足整小节时也按实际内容计时，
                否则弱起音之后会多出一段整小节的空白。
            */
            const durationQ =
                isImplicit && maxEndQ > 0
                    ? maxEndQ
                    : (
                        measureIndex === 0 &&
                        maxEndQ > 0 &&
                        maxEndQ < nominalQ
                    )
                        ? maxEndQ
                        : nominalQ;

            measures.push({
                notes,
                cc,
                tempo: measureTempo,
                durationQ
            });

            measureStartQ += durationQ;
        });

    return measures;
}

function parseMusicXML(xmlText){

    const doc = new DOMParser().parseFromString(
        xmlText,
        "application/xml"
    );

    if(doc.querySelector("parsererror")){
        throw new Error("MusicXML 不是合法的 XML");
    }

    const partEls =
        Array.from(doc.querySelectorAll("score-partwise > part"));

    if(!partEls.length){
        throw new Error("没有找到 <part>（仅支持 score-partwise）");
    }

    /* -------- part-list：名称 / 音色 / 音量 / 声像 -------- */

    const partMeta = new Map();

    doc.querySelectorAll("part-list > score-part").forEach(sp => {

        const id   = sp.getAttribute("id");
        const name =
            sp.querySelector("part-name")?.textContent?.trim() || id;

        const midiEl = sp.querySelector("midi-instrument");

        const programText =
            midiEl?.querySelector("midi-program")?.textContent;

        const program =
            programText
                ? clamp(parseInt(programText, 10) - 1, 0, 127)
                : guessProgram(name);

        const channelText =
            midiEl?.querySelector("midi-channel")?.textContent;

        const channel  = channelText ? parseInt(channelText, 10) : null;
        const volumeTxt = midiEl?.querySelector("volume")?.textContent;
        const panTxt    = midiEl?.querySelector("pan")?.textContent;

        partMeta.set(id, {
            id,
            name,
            program,
            channel,
            volume: volumeTxt ? clamp(parseFloat(volumeTxt), 0, 127) : 100,
            pan:    panTxt    ? clamp(parseFloat(panTxt), -64, 63) : 0,
            isPercussion: channel === 10
        });
    });

    /* -------- 每个声部独立解析 -------- */

    const parts = partEls.map((el, index) => {

        const id = el.getAttribute("id");

        const info = partMeta.get(id) || {
            id,
            name: id,
            program: 0,
            channel: null,
            volume: 100,
            pan: 0,
            isPercussion: false
        };

        return {
            info,
            index,
            measures: parsePartMeasures(el)
        };
    });

    /* -------- 通道分配 -------- */

    const usedChannels = new Set();

    parts.forEach(p => {

        if(p.info.isPercussion){
            p.info.channel = 9;
            usedChannels.add(9);
        }
    });

    parts.forEach(p => {

        if(typeof p.info.channel === "number" &&
           p.info.channel >= 1 &&
           p.info.channel <= 16 &&
           !p.info.isPercussion){

            const ch = p.info.channel - 1;

            if(!usedChannels.has(ch)){
                p.info.channel = ch;
                usedChannels.add(ch);
                return;
            }
        }

        if(typeof p.info.channel === "number" &&
           p.info.channel >= 0 &&
           p.info.channel <= 15 &&
           p.info.isPercussion){
            return;
        }

        let ch = 0;

        while(ch < 16 && (usedChannels.has(ch) || ch === 9)) ch++;

        if(ch >= 16) ch = p.index % 16;

        p.info.channel = ch;
        usedChannels.add(ch);
    });

    /* -------- 小节顺序（反复 / 房子） -------- */

    const firstPart   = parts[0];
    const measureMeta = firstPart.measures.map(() => ({
        repeatStart:false,
        repeatEnd:false,
        ending:null
    }));

    const firstMeasureEls =
        Array.from(partEls[0].children)
            .filter(el => el.tagName === "measure");

    firstMeasureEls.forEach((mEl, i) => {
        measureMeta[i] = readMeasureMeta(mEl);
    });

    const playbackMeasures = [];

    let repeatStart   = 0;
    let alreadyRepeated = false;

    for(let i = 0; i < measureMeta.length; i++){

        const meta = measureMeta[i];

        if(meta.repeatStart) repeatStart = i;

        if(
            alreadyRepeated &&
            meta.ending &&
            meta.ending.number.includes("1")
        ){
            continue;
        }

        playbackMeasures.push(i);

        if(meta.repeatEnd && !alreadyRepeated){

            alreadyRepeated = true;

            for(let j = repeatStart; j <= i; j++){

                const jm = measureMeta[j];

                if(
                    jm.ending &&
                    jm.ending.number.includes("1")
                ){
                    continue;
                }

                playbackMeasures.push(j);
            }
        }
    }

    /* -------- 速度表（优先 part 1） -------- */

    const tempos = [];

    firstPart.measures.forEach((m, i) => {

        if(m.tempo) tempos[i] = m.tempo;
    });

    if(!tempos[0]) tempos[0] = 120;

    /*
        MusicXML 的 <sound tempo> 就是四分音符 BPM，
        时间轴以四分音符为单位，直接 60/bpm 换算即可。
    */

    const measureDurations =
        firstPart.measures.map(m => m.durationQ);

    /* -------- 合成绝对时间轴 -------- */

    timeline = [];
    measureEvents = [];

    let noteSeq = 0;
    let tSec = 0;
    let bpm  = 120;

    playbackMeasures.forEach(mi => {

        const measureBpm = tempos[mi] ?? bpm;
        bpm = measureBpm;

        const spq = 60 / measureBpm;

        measureEvents.push({
            measureIndex: mi,
            startSec: tSec
        });

        parts.forEach(part => {

            const m = part.measures[mi];
            if(!m) return;

            m.notes.forEach(n => {

                const startSec = tSec + n.q * spq;
                const durSec   = Math.max(0.03, n.durQ * spq);

                const noteId = noteSeq++;

                timeline.push({
                    type:"on",
                    noteId,
                    channel: part.info.channel,
                    midi: n.midi,
                    velocity: n.velocity,
                    startSec
                });

                timeline.push({
                    type:"off",
                    noteId,
                    channel: part.info.channel,
                    midi: n.midi,
                    startSec: startSec + durSec
                });
            });

            m.cc.forEach(c => {

                timeline.push({
                    type:"cc",
                    channel: part.info.channel,
                    controller: c.controller,
                    value: c.value,
                    startSec: tSec + c.atQ * spq
                });
            });
        });

        tSec += (measureDurations[mi] ?? 4) * spq;
    });

    /*
        同一时刻先 noteOff 再 noteOn，避免同音高被误关。
        时间按 10 微秒取整后再比较，防止浮点误差把
        “先 off 后 on”排成“先 on 后 off”。
    */
    const timeKey = e => Math.round(e.startSec * 100000);

    /*
        小节线处经常同时出现“上一个音 noteOff”和“新小节踩下延音踏板”。
        如果踏板先于 noteOff 生效，上一个音会被踏板一直拖到新小节末
        （听感上就像那个音长了整整一小节）。这里把与 noteOff 同一时刻
        的踏板踩下事件推迟 1ms，确保先松开旧音再踩踏板。
    */
    const offTimes = new Set();

    timeline.forEach(e => {

        if(e.type === "off"){
            offTimes.add(`${e.channel}:${timeKey(e)}`);
        }
    });

    timeline.forEach(e => {

        if(
            e.type === "cc" &&
            e.controller === 64 &&
            e.value >= 64 &&
            offTimes.has(`${e.channel}:${timeKey(e)}`)
        ){
            e.startSec += 0.001;
        }
    });

    const sortTimeline = () => timeline.sort((a, b) => {

        const dt = timeKey(a) - timeKey(b);

        if(dt !== 0) return dt;

        const order = { off:0, cc:1, on:2 };

        /* 同一时刻先松开踏板，再踩下新踏板 */
        if(a.type === "cc" && b.type === "cc"){
            if(a.controller === 64 && b.controller === 64){
                return a.value - b.value;
            }
        }

        return order[a.type] - order[b.type];
    });

    sortTimeline();

    /*
        MIDI 同一通道、同一音高不能同时有两个独立发声的音。
        如果后一个同音高音符在前一个 noteOff 之前开始，
        把前一个的 noteOff 提前到后一个之前；否则后一个
        会被前一个的 noteOff 立刻掐掉（听起来像吞音）。
    */
    const offById = new Map();

    timeline.forEach(e => {
        if(e.type === "off") offById.set(e.noteId, e);
    });

    const lastOnByPitch = new Map();
    const dropped = new Set();

    timeline.forEach(e => {

        if(e.type !== "on") return;

        const key = `${e.channel}:${e.midi}`;
        const prev = lastOnByPitch.get(key);

        if(prev){

            const prevOff = offById.get(prev.noteId);

            if(prevOff && prevOff.startSec > e.startSec){

                /* 完全同时的同音重复只保留一个 */
                if(e.startSec - prev.startSec < 0.001){

                    const selfOff = offById.get(e.noteId);

                    dropped.add(e);
                    if(selfOff) dropped.add(selfOff);

                    return;
                }

                prevOff.startSec = Math.max(
                    prev.startSec + 0.0005,
                    e.startSec - 0.0005
                );
            }
        }

        lastOnByPitch.set(key, e);
    });

    if(dropped.size){
        timeline = timeline.filter(e => !dropped.has(e));
    }

    sortTimeline();

    totalSec = tSec;
    scoreParts = parts.map(p => p.info);

    return {
        tempo: tempos[0],
        partCount: parts.length
    };
}

   OSMD
========================================================= */

let measurePosMap = [];
let lastHighlightedMeasure = null;

function initOSMD(){

    scoreContainer.innerHTML = "";

    osmd =
        new opensheetmusicdisplay.OpenSheetMusicDisplay(
            "scoreContainer",
            {
                autoResize:true,
                drawingParameters:"compacttight",
                drawTitle:true,
                followCursor:false
            }
        );
}

async function renderScore(xml){

    await osmd.load(xml);
    await osmd.render();
}

/* =========================================================
   Measure Position
========================================================= */

function buildMeasurePosMap(){

    measurePosMap = [];

    try{

        const ml =
            osmd.GraphicSheet.MeasureList;

        /*
            每个小节在 MeasureList 里按谱表分开，
            这里把所有谱表的包围盒合并成整小节。
            存的是 SVG 用户单位，渲染时再换算成屏幕坐标。
        */

        ml.forEach((staffMeasures, idx) => {

            const boxes = staffMeasures
                .map(sm => sm && sm.PositionAndShape)
                .filter(Boolean);

            if(!boxes.length) return;

            const x0 = Math.min(
                ...boxes.map(b => b.AbsolutePosition.x * 10)
            );

            const y0 = Math.min(
                ...boxes.map(b => b.AbsolutePosition.y * 10)
            );

            const x1 = Math.max(
                ...boxes.map(
                    b => b.AbsolutePosition.x * 10
                        + b.Size.width * 10
                )
            );

            const y1 = Math.max(
                ...boxes.map(
                    b => b.AbsolutePosition.y * 10
                        + b.Size.height * 10
                )
            );

            measurePosMap[idx] = {
                x:x0,
                y:y0,
                w:x1 - x0,
                h:y1 - y0
            };
        });

        /* 窗口缩放后重新贴一次高亮 */

        if(isPlaying && lastHighlightedMeasure != null){

            highlightMeasure(lastHighlightedMeasure);
        }

    }catch(e){

        console.warn(e);
    }
}

/* =========================================================
   Playback
========================================================= */

function currentPrograms(){

    const override = instrumentSelect.value;

    return scoreParts.map(part => ({

        channel: part.channel,
        program:
            override === "auto"
                ? part.program
                : clamp(parseInt(override, 10), 0, 127),
        volume: part.volume,
        pan: part.pan
    }));
}

function stopPlayback(){

    playbackId++;

    isPlaying = false;

    clearInterval(schedulerTimer);
    schedulerTimer = null;

    timerIds.forEach(clearTimeout);
    timerIds = [];

    if(synth && audioCtx){

        const now = audioCtx.currentTime;

        /*
            记录旧队列的到期时间。停止后立刻重播时，
            startPlayback 会等这批旧事件过期再解除静音。
        */
        scheduledUntil = Math.max(
            scheduledUntil,
            now + SCHEDULE_LOOKAHEAD
        );

        /*
            先把输出压到 0 再停音符：
            worklet 队列里最多还有 300ms 已排好的事件，
            静音能保证按下停止后立刻听不到声音，
            稍后再补一次 stopAll 清掉这些音。
        */

        if(masterGain){

            masterGain.gain.cancelScheduledValues(now);
            masterGain.gain.setValueAtTime(masterGain.gain.value, now);
            masterGain.gain.linearRampToValueAtTime(0, now + 0.02);
        }

        try{
            synth.stopAll(true);
        }catch(e){}

        clearTimeout(panicTimer);

        panicTimer = setTimeout(() => {

            try{
                synth.stopAll(true);
            }catch(e){}

            /*
                这里不恢复音量：保持静音直到下一次播放，
                这样即使有滞留的释音尾巴也绝不会漏出来。
            */

            panicTimer = null;

        }, SCHEDULE_LOOKAHEAD * 1000 + 250);
    }

    hideHighlight();

    playBtn.disabled = false;
    stopBtn.disabled = true;
}

function sendTimelineEvent(ev, at){

    const options = { time: at };

    if(ev.type === "on"){

        synth.noteOn(ev.channel, ev.midi, ev.velocity, options);
    }
    else if(ev.type === "off"){

        synth.noteOff(ev.channel, ev.midi, options);
    }
    else{

        synth.controllerChange(
            ev.channel,
            ev.controller,
            ev.value,
            options
        );
    }
}

async function startPlayback(){

    if(!timeline.length) return;

    stopPlayback();

    const myPlaybackId = ++playbackId;

    isPlaying = true;

    playBtn.disabled = true;
    stopBtn.disabled = false;

    try{

        await ensureSoundfont();

    }catch(e){

        isPlaying = false;

        playBtn.disabled = false;
        stopBtn.disabled = true;

        setStatus(
            "❌ 音色库加载失败：" + e.message +
            "（请用本地服务器打开页面）",
            true
        );

        return;
    }

    if(myPlaybackId !== playbackId) return;

    clearTimeout(panicTimer);
    panicTimer = null;

    /* 布局稳定后校准一次小节坐标（滚动条出现会让视口宽度变化） */
    buildMeasurePosMap();

    const ctx  = audioCtx;
    const now0 = ctx.currentTime;

    /*
        如果刚刚停止过，worklet 里还留着上一次排到未来
        300ms 左右的事件。等它们过期后再解除静音，避免
        旧音符在新一次播放开头漏出来。
    */
    const t0 = Math.max(
        now0 + SCHEDULE_LOOKAHEAD,
        scheduledUntil + 0.05
    );

    audioGateUntil = t0;

    if(masterGain){

        const g = masterGain.gain;
        const fadeAt = Math.max(now0, t0 - 0.02);

        g.cancelScheduledValues(now0);
        g.setValueAtTime(0, now0);
        g.setValueAtTime(0, fadeAt);
        g.linearRampToValueAtTime(targetVolume, t0);
    }

    const speed = 1 / (tempoMultiplier || 1);

    // 清掉上一次可能还在发声的音（队列里的旧事件已靠静音隔离）
    synth.stopAll(true);

    const programs = currentPrograms();

    programs.forEach(p => {

        synth.programChange(p.channel, p.program, { time:t0 });
        synth.controllerChange(p.channel, 7,  p.volume, { time:t0 });
        synth.controllerChange(p.channel, 10, clamp(p.pan + 64, 0, 127), { time:t0 });
        synth.controllerChange(p.channel, 64, 0, { time:t0 });
    });

    /*
        只把接下来 300ms 的事件交给 worklet，
        避免整首曲子的 noteOn 提前排在队列里无法撤销。
    */

    let eventIndex = 0;

    const feed = () => {

        if(myPlaybackId !== playbackId) return;

        const now = ctx.currentTime;
        const horizon = now + SCHEDULE_LOOKAHEAD;

        while(eventIndex < timeline.length){

            const ev = timeline[eventIndex];
            const at = t0 + ev.startSec * speed;

            if(at > horizon) break;

            const when = Math.max(at, now);

            sendTimelineEvent(ev, when);

            scheduledUntil = Math.max(scheduledUntil, when);

            eventIndex++;
        }

        if(eventIndex >= timeline.length){

            clearInterval(schedulerTimer);
            schedulerTimer = null;
        }
    };

    feed();
    schedulerTimer = setInterval(feed, 25);

    setStatus(
        `🎶 播放中… ${scoreParts.length} 声部 · ` +
        `${scoreParts.map(p => p.name).join(" / ")}`
    );

    /* -------- 光标 -------- */

    const leadMs = Math.max(0, (t0 - ctx.currentTime) * 1000);

    measureEvents.forEach(ev => {

        const ms = ev.startSec * speed * 1000;

        const tid = setTimeout(() => {

            if(isPlaying && myPlaybackId === playbackId){
                highlightMeasure(ev.measureIndex);
            }

        }, leadMs + Math.max(0, ms));

        timerIds.push(tid);
    });

    /* -------- 结束 -------- */

    const endId = setTimeout(() => {

        if(isPlaying && myPlaybackId === playbackId){

            stopPlayback();
            setStatus("✅ 播放完毕");
        }

    }, leadMs + totalSec * speed * 1000 + 1500);

    timerIds.push(endId);
}

/* =========================================================
   Load
========================================================= */

async function loadScore(xml, fileName){

    stopPlayback();

    setStatus("📖 正在解析...");

    playBtn.disabled = true;

    try{

        initOSMD();

        await renderScore(xml);

        const info = parseMusicXML(xml);

        parsedFileName = fileName;

        buildMeasurePosMap();

        /* 滚动条出现 / OSMD 自动重排后，再校准一次 */
        setTimeout(() => {

            if(osmd) buildMeasurePosMap();

        }, 350);

        playBtn.disabled = false;

        setStatus(
            `✅ ${fileName} · ${info.partCount} 声部 · ` +
            scoreParts
                .map(p => `${p.name} (${GM_NAMES[p.program]})`)
                .join(" / ")
        );

    }catch(e){

        console.error(e);

        setStatus(
            "❌ 解析失败：" + e.message,
            true
        );
    }
}

fileInput.addEventListener("change", e => {

    const f = e.target.files[0];

    if(!f) return;

    const reader = new FileReader();

    reader.onload = async ev => {

        await loadScore(ev.target.result, f.name);
    };

    reader.readAsText(f);
});

stopBtn.addEventListener("click", () => {

    stopPlayback();

    setStatus("⏸ 已停止");
});

tempoSlider.addEventListener("input", () => {

    tempoMultiplier =
        parseInt(tempoSlider.value) / 100;

    tempoText.textContent = tempoSlider.value + "%";
});

volumeSlider.addEventListener("input", () => {

    targetVolume = parseInt(volumeSlider.value, 10) / 100;

    if(masterGain && isPlaying && !panicTimer){

        const now = audioCtx.currentTime;

        /* 新一次播放还没真正开始：保持静音，音量在 t0 生效 */
        if(now >= audioGateUntil){

            masterGain.gain.cancelScheduledValues(now);
            masterGain.gain.setValueAtTime(targetVolume, now);
        }
        else{

            masterGain.gain.cancelScheduledValues(now);
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.setValueAtTime(
                0,
                Math.max(now, audioGateUntil - 0.02)
            );
            masterGain.gain.linearRampToValueAtTime(
                targetVolume,
                audioGateUntil
            );
        }
    }
});

instrumentSelect.addEventListener("change", () => {

    if(!synth) return;

    const t = audioCtx.currentTime;

    currentPrograms().forEach(p => {

        synth.programChange(p.channel, p.program, { time:t });
    });
});

window.addEventListener("resize", () => {

    setTimeout(buildMeasurePosMap, 200);
});

if(new URLSearchParams(location.search).has("debug")){

    // 调试钩子：只在 player.html?debug=1 时暴露，方便排查解析/发声问题
    window.__player = {
        get timeline(){ return timeline; },
        get parts(){ return scoreParts; },
        get totalSec(){ return totalSec; },
        get soundfontReady(){ return soundfontReady; },
        get synth(){ return synth; },
        get audioCtx(){ return audioCtx; },
        get loudnessGain(){ return loudnessGain; },
        get masterGain(){ return masterGain; },
        get isPlaying(){ return isPlaying; },
        get lastMeasure(){ return lastHighlightedMeasure; },
        get posMap(){ return measurePosMap; },
        get osmd(){ return osmd; },
        rebuild: () => buildMeasurePosMap(),
        get scoreWrapper(){ return scoreWrapper; },
        loadScore
    };
}

setStatus("🎼 就绪，请加载 MusicXML 文件");

/* 页面空闲时预取音色库，第一次点播放就不用等 */

if(location.protocol !== "file:"){

    const idle =
        window.requestIdleCallback ||
        (fn => setTimeout(fn, 800));

    idle(() => {

        ensureSoundfont().then(() => {

            if(!isPlaying && !parsedFileName){
                setStatus("🎼 音色库就绪，请加载 MusicXML 文件");
            }

        }).catch(e => console.warn("音色库预加载失败：", e));
    });
}

</script>
